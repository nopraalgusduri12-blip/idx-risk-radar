# Fly.io: `fly launch --no-deploy`, `fly volumes create radar_data --size 1 --region sin`,
# `fly secrets set RADAR_TOKEN=...`, then `fly deploy`. See DEPLOY.md.
app = "idx-risk-radar"
primary_region = "sin"

[env]
  RADAR_DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "radar_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpus = 1
